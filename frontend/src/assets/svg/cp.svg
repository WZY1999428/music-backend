<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="fileGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5DA9FF"/>
      <stop offset="100%" stop-color="#8BC6FF"/>
    </linearGradient>

    <rect id="fileIcon" width="18" height="12" rx="2" fill="url(#fileGrad)" />
  </defs>


  <!-- 源目录 -->
  <g transform="translate(20, 15)">
    <path d="M0 10 Q0 0 10 0 H50 L60 15 H110 Q120 15 120 25 V80 Q120 90 110 90 H10 Q0 90 0 80 Z" fill="url(#folderGrad)" />
    <path d="M0 30 Q0 20 10 20 H110 Q120 20 120 30 V80 Q120 90 110 90 H10 Q0 90 0 80 Z" fill="#FFE082" />
  </g>

  <!-- 目标目录 -->
  <g transform="translate(260, 15)">
    <path d="M0 10 Q0 0 10 0 H50 L60 15 H110 Q120 15 120 25 V80 Q120 90 110 90 H10 Q0 90 0 80 Z" fill="url(#folderGrad)" />
    <path d="M0 30 Q0 20 10 20 H110 Q120 20 120 30 V80 Q120 90 110 90 H10 Q0 90 0 80 Z" fill="#FFE082" />
  </g>

  <!-- 文件流动动画 -->
  <g>
    <use href="#fileIcon" x="120" y="50">
      <animate
        attributeName="x"
        from="120"
        to="260"
        dur="1.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="1.4s"
        repeatCount="indefinite"
      />
    </use>

    <use href="#fileIcon" x="120" y="70">
      <animate
        attributeName="x"
        from="120"
        to="260"
        dur="1.4s"
        begin="0.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="1.4s"
        begin="0.4s"
        repeatCount="indefinite"
      />
    </use>
  </g>
</svg>
